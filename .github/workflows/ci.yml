# SPDX-License-Identifier: Apache-2.0

# constitution「開発ワークフローと品質ゲート」が定める項目を、マージの条件として
# 実行する。ローカルの `make all` と同じ内容を同じツールで走らせる。
#
# ツールのバージョンはすべて固定する。暗黙の更新で同一コミットの判定結果が
# 変わる状態にしない (constitution v1.3.0)。
name: ci

on:
  pull_request:
  push:
    branches: [main]

# 読み取りのみ。CI が成果物を書き換える必要はない。
permissions:
  contents: read

env:
  # Makefile と同じ値。片方だけ更新すると手元と CI で判定結果が食い違う。
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.7.0
  BETTERLEAKS_VERSION: v1.8.1
  ACTIONLINT_VERSION: v1.7.12
  IMAGE_NAME: external-dns-iij-dpf-webhook

jobs:
  # シークレットの混入検査。constitution v1.12.0 が main へのマージ前の
  # 検査を MUST としている。
  secrets:
    name: シークレットの混入検査
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # **履歴全体を取得する。** 既定の浅いクローンでは、検査が
          # 直近のコミットしか見ない。「コミットしてから消した」という
          # 最も起きやすい経路を素通しする (constitution v1.12.0)。
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: betterleaks を導入する
        # バージョンを固定する。同一の履歴に対する判定結果が
        # ツールの更新で変わらないようにするため (constitution v1.12.0)。
        run: go install github.com/betterleaks/betterleaks@${BETTERLEAKS_VERSION}

      - name: 履歴を検査する
        # 設定はリポジトリの .betterleaks.toml を使う。手元と同一にするため。
        run: make secret-scan

  # Go のコード品質。イメージを要さないため独立して速く回る。
  go:
    name: Go の品質ゲート
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Go を用意する
        uses: actions/setup-go@v7.0.0
        with:
          # go.mod の go ディレクティブに従う。定義を 1 箇所に保つ。
          go-version-file: go.mod
          cache: true

      - name: 整形されていることを確認する
        run: make fmt-check

      - name: ワークフローが妥当であることを確認する
        # 秘密情報を要さないため、Dependabot 起点の実行でも実行される
        # (FR-012、contracts/ci-gates.md「秘密情報を要しない検査」)。
        #
        # Dependabot の github-actions 種別がアクションの版を自動で書き換える。
        # 書き換え後のワークフローが妥当であることを機械的に確かめる。
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}
          make workflow-lint

      - name: 全 Go ファイルに SPDX ヘッダがあることを確認する
        run: make license-check

      - name: ビルドする
        run: make build

      - name: 静的解析を実行する
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # 設定はリポジトリの .golangci.yml を使う。ローカルと同一にするため。
          args: --timeout=5m

      - name: テストを実行する
        # 契約テスト・統合テスト・単体テストをすべて含む。
        run: make test

  # 脆弱性検査。到達可能な既知脆弱性があればマージを止める。
  vuln:
    name: 脆弱性検査
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck を実行する
        # golang/govulncheck-action はバージョンを指定できない。constitution v1.3.0 が
        # ツールのバージョン固定を求めるため、自前で導入して make 経由で実行する。
        # 到達可能な脆弱性のみが対象であり、呼び出していないものは止めない。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          make vuln

      - name: 依存ライセンスが許容範囲に収まることを確認する
        run: |
          go install github.com/google/go-licenses/v2@latest
          make license-deps

  # 配布成果物の検証。イメージのビルドを伴うため分ける。
  image:
    name: 配布イメージの検証
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: buildx を用意する
        uses: docker/setup-buildx-action@v4.3.0

      - name: イメージをビルドする
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: build/Containerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci

      - name: ASLR が有効であることを確認する
        # constitution v1.6.0: ASLR が有効であることを CI で検証すること (MUST)
        # research R1: CGO_ENABLED=0 -buildmode=pie は PT_INTERP を持ち scratch で起動しない
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:ci
        run: |
          bin=$(mktemp)
          cid=$(docker create "$IMAGE_REF")
          docker cp "$cid:/webhook" "$bin" >/dev/null
          docker rm "$cid" >/dev/null

          # readelf の出力はロケールで翻訳される。C に固定する。
          type=$(LC_ALL=C readelf -h "$bin" | awk '/^ *Type:/ {print $2}')
          if [ "$type" != "DYN" ]; then
            echo "::error::ELF Type が $type です (PIE ではないため ASLR が無効)"
            exit 1
          fi
          if LC_ALL=C readelf -l "$bin" | grep -q INTERP; then
            echo "::error::PT_INTERP を持つため scratch では起動しません"
            exit 1
          fi
          echo "OK: static PIE (ELF Type=DYN, PT_INTERP なし)"

      - name: ライセンスの同梱と OCI アノテーションを確認する
        # constitution v1.10.0
        run: make verify-licenses IMAGE=${{ env.IMAGE_NAME }}:ci CONTAINER_TOOL=docker

      - name: 既定設定が拒否側であることを確認する
        # constitution 原則 VI。配布される成果物そのものが既定拒否であることを見る。
        run: make verify-defaults IMAGE=${{ env.IMAGE_NAME }}:ci CONTAINER_TOOL=docker

      - name: イメージの脆弱性を走査する
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: table
          # 深刻なものだけを止める。情報提供目的の指摘でマージを妨げない。
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
