# betterleaks の設定。
#
# constitution v1.12.0:
#   - main へマージする前にシークレットの混入を検査すること (MUST)
#   - 検出があった場合はマージしないこと (MUST NOT)
#   - 誤検出であると判断する場合は、その根拠をここに記述し、検査を通る状態に
#     してからマージすること (MUST)。検査を迂回して個別に判断しないこと (MUST NOT)
#
# 現時点で除外は 1 件もない。既定の検出規則だけで検出ゼロを確認済みである。
#
# **推測で除外を先回りして足さないこと。** 根拠のない除外は、後から見た者が
# 正当な除外なのか取りこぼしなのか判断できず、実際に混入したときにそれを隠す。
# 除外を追加するのは、実際に誤検出が出てからにする。

[extend]
useDefault = true

# 独自の検出規則を足す場合は [[rules]] をここに追加する。
# 既定規則の上書きはしない。

# 除外 ([allowlist]) は現時点で不要なため定義しない。必要になった時点で
# 追加する。空の [allowlist] は betterleaks が受け付けない。
