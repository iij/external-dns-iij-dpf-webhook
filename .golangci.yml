# golangci-lint configuration.
#
# constitution v1.8.0 「Go コード品質」:
#   - ローカルと CI が同一の設定で動くこと (MUST)
#   - 有効な linter とそのバージョンを設定ファイルで固定すること (MUST)
#   - 個別の指摘を回避するために linter を無効化しないこと (MUST NOT)
#   - nolint には理由を併記すること (MUST)
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck # 返り値のエラーを捨てていないか。原則 IV「エラーを握り潰さない」の機械的検査
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose # HTTP レスポンスボディの閉じ忘れ
    - contextcheck
    - errorlint # errors.Is/As による判定漏れ。エラー分類が要となるため
    - gosec
    - noctx # context なしの HTTP 要求
    - nilerr
    - revive
    - copyloopvar
    - misspell
    - unconvert
    - unparam
    - wastedassign
    - depguard # シークレット管理サービスの SDK を持ち込ませない (constitution v3.0.0)

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    depguard:
      rules:
        # constitution v3.0.0: トークンはマウントされたファイルからのみ取得し、
        # 外部のシークレット管理サービスへ接続しない (MUST NOT)。接続するコードが
        # リンクされないことを、レビューではなく lint で保証する。
        no-secret-manager:
          files:
            - $all
          deny:
            - pkg: github.com/hashicorp/vault
              desc: "constitution v3.0.0: トークンはマウントされたファイルからのみ取得する。シークレット管理サービスへ接続しない"
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: "constitution v3.0.0: トークンはマウントされたファイルからのみ取得する。シークレット管理サービスへ接続しない"
            - pkg: github.com/Azure/azure-sdk-for-go
              desc: "constitution v3.0.0: トークンはマウントされたファイルからのみ取得する。シークレット管理サービスへ接続しない"
            - pkg: cloud.google.com/go/secretmanager
              desc: "constitution v3.0.0: トークンはマウントされたファイルからのみ取得する。シークレット管理サービスへ接続しない"
            - pkg: github.com/iij/dpf-go/misc
              desc: "constitution v3.0.0: トークンはマウントされたファイルからのみ取得する。シークレット管理サービスへ接続しない"
    revive:
      rules:
        - name: exported
          disabled: true # 公開 API を持たない単一サービスのため

  exclusions:
    rules:
      # テストでは前提を固定するための型アサーションが多く、また入力は自前で用意する。
      - path: _test\.go$
        linters:
          - gosec
          - errcheck
          # テストの補助的な接続確認は文脈を伴わない。本番コードでは noctx を有効に保つ。
          - noctx
          # テスト補助関数は後続のテストからも使うため、引数を一般化してある。
          - unparam

issues:
  # 既定の上限は指摘を隠す。すべて出す。
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
